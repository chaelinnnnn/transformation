<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just One Thing</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #16130f;
    --surface: #211d18;
    --surface2: #2c2720;
    --border: rgba(255,255,255,0.07);
    --accent: oklch(0.72 0.16 55);
    --accent2: oklch(0.72 0.16 25);
    --accent-dim: oklch(0.72 0.16 55 / 0.15);
    --text: #f0ebe4;
    --text-muted: rgba(240,235,228,0.45);
    --text-soft: rgba(240,235,228,0.7);
    --radius: 16px;
    --radius-sm: 10px;
    --font: 'DM Sans', sans-serif;
  }
  html, body { width: 100%; height: 100%; background: var(--bg); font-family: var(--font); color: var(--text); }
  #root { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes presence { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
  @keyframes drop { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#d4813a",
  "darkMode": true,
  "presenceCount": 247,
  "timerMinutes": 25
}/*EDITMODE-END*/;

// ── Shared UI ──────────────────────────────────────────────
function Btn({ children, onClick, variant = 'primary', style: s, disabled }) {
  const base = {
    display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
    border: 'none', cursor: disabled ? 'not-allowed' : 'pointer',
    fontFamily: 'var(--font)', fontWeight: 600, fontSize: 15,
    borderRadius: 12, padding: '0 20px', minHeight: 50, transition: 'all 0.18s',
    opacity: disabled ? 0.4 : 1,
  };
  const styles = {
    primary: { background: 'var(--accent)', color: '#16130f' },
    ghost: { background: 'var(--surface2)', color: 'var(--text-soft)', border: '1px solid var(--border)' },
    outline: { background: 'transparent', color: 'var(--accent)', border: '1.5px solid var(--accent)' },
    danger: { background: 'oklch(0.55 0.18 25 / 0.15)', color: 'oklch(0.75 0.18 25)', border: '1px solid oklch(0.75 0.18 25 / 0.25)' },
  };
  return (
    <button onClick={onClick} disabled={disabled} style={{ ...base, ...styles[variant], ...s }}
      onMouseEnter={e => { if (!disabled) e.currentTarget.style.filter = 'brightness(1.1)'; }}
      onMouseLeave={e => { e.currentTarget.style.filter = ''; }}>
      {children}
    </button>
  );
}

function Screen({ children, style: s }) {
  return (
    <div style={{
      width: 375, minHeight: 812, background: 'var(--bg)',
      display: 'flex', flexDirection: 'column',
      position: 'relative', overflow: 'hidden',
      borderRadius: 40, boxShadow: '0 40px 80px rgba(0,0,0,0.6)',
      animation: 'fadeIn 0.3s ease', ...s
    }}>
      {children}
    </div>
  );
}

function Tag({ children, color = 'var(--accent)', style: s }) {
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center',
      padding: '4px 10px', borderRadius: 99,
      background: color + '18', color,
      fontSize: 12, fontWeight: 600, letterSpacing: '0.04em',
      ...s,
    }}>{children}</span>
  );
}

// ── Screen 1: Input ────────────────────────────────────────
function InputScreen({ onNext }) {
  const [task, setTask] = useState('');
  const [focused, setFocused] = useState(false);
  const examples = ['Build a workout habit', 'Read for 30 minutes', 'Update my portfolio', 'Start learning Spanish'];
  const [exIdx, setExIdx] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setExIdx(i => (i+1) % examples.length), 2200);
    return () => clearInterval(t);
  }, []);
  return (
    <Screen>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', padding: '72px 28px 40px' }}>
        <div style={{ animation: 'fadeUp 0.5s ease' }}>
          <h1 style={{ fontSize: 30, fontWeight: 700, lineHeight: 1.25, color: 'var(--text)', marginBottom: 10 }}>
            Today,<br />
            <span style={{ color: 'var(--accent)' }}>just one thing.</span>
          </h1>
          <p style={{ fontSize: 14, color: 'var(--text-muted)', lineHeight: 1.6, marginBottom: 36 }}>
            It doesn't have to be big. What's one task or goal you want to start today?
          </p>
        </div>

        <div style={{ animation: 'fadeUp 0.5s 0.1s ease both' }}>
          <div style={{
            border: `1.5px solid ${focused ? 'var(--accent)' : 'var(--border)'}`,
            borderRadius: 14, padding: '4px', background: 'var(--surface)',
            transition: 'border-color 0.2s', marginBottom: 12,
          }}>
            <textarea
              value={task}
              onChange={e => setTask(e.target.value)}
              onFocus={() => setFocused(true)}
              onBlur={() => setFocused(false)}
              placeholder={`e.g. ${examples[exIdx]}`}
              style={{
                width: '100%', minHeight: 100, background: 'transparent', border: 'none', outline: 'none',
                color: 'var(--text)', fontSize: 16, fontFamily: 'var(--font)', lineHeight: 1.6,
                resize: 'none', padding: '14px 16px',
              }}
            />
          </div>
        </div>

        <div style={{ flex: 1 }} />

        <div style={{ animation: 'fadeUp 0.5s 0.2s ease both' }}>
          <Btn onClick={() => onNext(task || 'Update my portfolio')} style={{ width: '100%' }}>
            Next →
          </Btn>
          <p style={{ textAlign: 'center', marginTop: 14, fontSize: 12, color: 'var(--text-muted)' }}>
            Others are starting right now, too
          </p>
        </div>
      </div>
    </Screen>
  );
}

// ── Screen 2: AI Loading ───────────────────────────────────
function LoadingScreen({ task, onNext }) {
  const [phase, setPhase] = useState(0);
  const phases = ['Understanding your task...', 'Finding the smallest first step...', 'Building your custom steps...'];
  useEffect(() => {
    const t1 = setTimeout(() => setPhase(1), 1000);
    const t2 = setTimeout(() => setPhase(2), 2100);
    const t3 = setTimeout(() => onNext(), 3400);
    return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
  }, []);
  return (
    <Screen>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 40 }}>
        <div style={{ width: 64, height: 64, marginBottom: 32, position: 'relative' }}>
          <div style={{
            width: 64, height: 64, borderRadius: '50%',
            border: '2px solid var(--border)',
            borderTopColor: 'var(--accent)',
            animation: 'spin 0.9s linear infinite',
          }} />
        </div>

        <div style={{ background: 'var(--surface)', borderRadius: 14, padding: '16px 20px', marginBottom: 28, maxWidth: 280, width: '100%' }}>
          <p style={{ fontSize: 13, color: 'var(--text-muted)', marginBottom: 6 }}>Analyzing</p>
          <p style={{ fontSize: 15, fontWeight: 600, color: 'var(--text)', wordBreak: 'break-word' }}>"{task}"</p>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 10, width: '100%', maxWidth: 280 }}>
          {phases.map((p, i) => (
            <div key={i} style={{
              display: 'flex', alignItems: 'center', gap: 12,
              opacity: phase >= i ? 1 : 0.2, transition: 'opacity 0.4s',
            }}>
              <div style={{
                width: 20, height: 20, borderRadius: '50%', flexShrink: 0,
                background: phase > i ? 'var(--accent)' : phase === i ? 'var(--accent-dim)' : 'var(--surface2)',
                border: phase === i ? '1.5px solid var(--accent)' : '1.5px solid var(--border)',
              }}/>
              <span style={{ fontSize: 13, color: phase >= i ? 'var(--text-soft)' : 'var(--text-muted)' }}>{p}</span>
            </div>
          ))}
        </div>
      </div>
    </Screen>
  );
}

// ── Screen 3: Steps ────────────────────────────────────────
const STEPS_DATA = [
  { id: 1, label: 'Step 1', title: 'Just sit down for 5 min',
    options: [
      { id: 'a', text: 'Set a 5-min timer and just sit at your desk', time: '5 min' },
      { id: 'b', text: 'Open your laptop and create one blank document', time: '3 min' },
      { id: 'c', text: 'Write down exactly one thing you can do right now', time: '2 min' },
    ] },
  { id: 2, label: 'Step 2', title: 'Start with the easiest bit',
    options: [
      { id: 'a', text: 'Open an existing file and review where you left off', time: '10 min' },
      { id: 'b', text: 'Find 3 references or examples on Google', time: '8 min' },
      { id: 'c', text: 'Sketch a quick outline or structure', time: '7 min' },
    ] },
  { id: 3, label: 'Step 3', title: 'Finish one small piece',
    options: [
      { id: 'a', text: 'Bring just one section to a complete state', time: '20 min' },
      { id: 'b', text: 'Get the overall flow down, even as a rough draft', time: '25 min' },
      { id: 'c', text: 'Save it in a form you could show someone', time: '15 min' },
    ] },
];

function StepsScreen({ task, onNext }) {
  const [steps, setSteps] = useState(
    STEPS_DATA.map(s => ({ ...s, chosen: s.options[0].text, chosenTime: s.options[0].time }))
  );
  const [editingIdx, setEditingIdx] = useState(null);
  const [dragState, setDragState] = useState(null);
  const listRef = useRef(null);
  const cardRefs = useRef([]);

  const handleStart = () => onNext(steps);

  const getInsertIdx = (clientY) => {
    if (!listRef.current) return 0;
    const cards = cardRefs.current;
    for (let i = 0; i < cards.length; i++) {
      if (!cards[i]) continue;
      const rect = cards[i].getBoundingClientRect();
      if (clientY < rect.top + rect.height / 2) return i;
    }
    return cards.length - 1;
  };

  const onHandlePointerDown = (e, idx) => {
    e.preventDefault();
    e.stopPropagation();
    const startY = e.clientY;
    setDragState({ idx, startY, currentY: startY, insertAt: idx });

    const onMove = (ev) => {
      const clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
      const insertAt = getInsertIdx(clientY);
      setDragState(d => d ? { ...d, currentY: clientY, insertAt } : null);
    };
    const onUp = (ev) => {
      setDragState(d => {
        if (!d) return null;
        const clientY = ev.touches ? ev.changedTouches[0].clientY : ev.clientY;
        const to = getInsertIdx(clientY);
        if (to !== d.idx) {
          setSteps(prev => {
            const arr = [...prev];
            const [item] = arr.splice(d.idx, 1);
            arr.splice(to, 0, item);
            return arr.map((s, i) => ({ ...s, label: `Step ${i+1}`, id: i+1 }));
          });
        }
        return null;
      });
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('touchend', onUp);
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onUp);
  };

  const DragHandle = ({ idx }) => (
    <div
      onPointerDown={e => onHandlePointerDown(e, idx)}
      onTouchStart={e => onHandlePointerDown(e, idx)}
      style={{ color: 'var(--text-muted)', opacity: 0.45, flexShrink: 0, cursor: 'grab', display: 'flex', alignItems: 'center', padding: '8px 4px', touchAction: 'none' }}>
      <svg width="14" height="12" viewBox="0 0 16 14" fill="none">
        <rect y="0" width="16" height="2" rx="1" fill="currentColor"/>
        <rect y="6" width="16" height="2" rx="1" fill="currentColor"/>
        <rect y="12" width="16" height="2" rx="1" fill="currentColor"/>
      </svg>
    </div>
  );

  const isDragging = dragState !== null;
  const draggedIdx = dragState ? dragState.idx : -1;
  const insertAt = dragState ? dragState.insertAt : -1;
  const dy = dragState ? dragState.currentY - dragState.startY : 0;

  return (
    <Screen>
      <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
        <div style={{ padding: '56px 28px 16px' }}>
          <h2 style={{ fontSize: 22, fontWeight: 700, marginBottom: 4 }}>Your 3-step plan</h2>
          <p style={{ fontSize: 13, color: 'var(--text-muted)' }}>Hold ≡ to reorder · Edit to change</p>
        </div>
        <div ref={listRef} style={{ flex: 1, overflowY: 'auto', padding: '8px 20px', userSelect: 'none' }}>
          {steps.map((step, si) => {
            const shift = isDragging && si !== draggedIdx
              ? (si >= Math.min(draggedIdx, insertAt) && si <= Math.max(draggedIdx, insertAt)
                  ? (insertAt < draggedIdx ? 76 : -76)
                  : 0)
              : 0;
            return (
              <div
                key={step.title + si}
                ref={el => cardRefs.current[si] = el}
                style={{
                  marginBottom: 10,
                  position: 'relative',
                  zIndex: si === draggedIdx ? 10 : 1,
                  transform: si === draggedIdx
                    ? `translateY(${dy}px) scale(1.02)`
                    : `translateY(${shift}px)`,
                  transition: si === draggedIdx ? 'box-shadow 0.15s' : 'transform 0.2s cubic-bezier(0.25,0.46,0.45,0.94)',
                  animation: !isDragging ? `fadeUp 0.4s ${si * 0.08}s ease both` : 'none',
                }}>
                <div style={{
                  background: 'var(--surface)',
                  border: `1.5px solid ${si === draggedIdx ? 'var(--accent)' : 'var(--border)'}`,
                  borderRadius: 16, padding: '14px 16px',
                  display: 'flex', alignItems: 'center', gap: 12,
                  minHeight: 64,
                  boxShadow: si === draggedIdx ? '0 12px 32px rgba(0,0,0,0.4)' : 'none',
                  transition: 'border-color 0.15s, box-shadow 0.15s',
                }}>
                  <DragHandle idx={si} />
                  <div style={{
                    width: 34, height: 34, borderRadius: '50%', flexShrink: 0,
                    background: 'var(--accent)', color: '#16130f',
                    display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 700,
                  }}>{si + 1}</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 11, color: 'var(--text-muted)', marginBottom: 2 }}>Step {si + 1}</div>
                    {editingIdx === si ? (
                      <input
                        autoFocus
                        defaultValue={step.title}
                        onKeyDown={e => {
                          if (e.key === 'Enter') { setSteps(prev => prev.map((s, i) => i === si ? { ...s, title: e.target.value } : s)); setEditingIdx(null); }
                          if (e.key === 'Escape') setEditingIdx(null);
                        }}
                        onChange={e => setSteps(prev => prev.map((s, i) => i === si ? { ...s, title: e.target.value } : s))}
                        style={{
                          background: 'transparent', border: 'none', outline: 'none',
                          color: 'var(--text)', fontSize: 14, fontWeight: 700,
                          fontFamily: 'var(--font)', width: '100%', padding: 0,
                          borderBottom: '1.5px solid rgba(240,235,228,0.4)',
                        }}
                      />
                    ) : (
                      <div style={{ fontSize: 14, fontWeight: 700, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{step.title}</div>
                    )}
                  </div>
                  {editingIdx === si ? (
                    <button
                      onClick={e => { e.stopPropagation(); setEditingIdx(null); }}
                      style={{
                        flexShrink: 0, background: 'var(--accent)', border: 'none',
                        borderRadius: 10, minHeight: 50, padding: '0 12px', cursor: 'pointer',
                        fontSize: 15, color: '#16130f', fontFamily: 'var(--font)', fontWeight: 700,
                      }}>Done</button>
                  ) : (
                    <button
                      onClick={e => { e.stopPropagation(); setEditingIdx(si); }}
                      style={{
                        flexShrink: 0, background: 'var(--surface2)',
                        border: '1px solid var(--border)', borderRadius: 10,
                        minHeight: 50, padding: '0 12px', cursor: 'pointer',
                        fontSize: 15, color: 'var(--text-muted)', fontFamily: 'var(--font)', fontWeight: 600,
                      }}>Edit</button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
        <div style={{ padding: '12px 20px 32px' }}>
          <Btn onClick={handleStart} style={{ width: '100%' }}>
            Start with this plan →
          </Btn>
        </div>
      </div>
    </Screen>
  );
}

// ── Screen 4: Timer ────────────────────────────────────────
const FALLBACK_STEPS = STEPS_DATA.map((s, i) => ({ ...s, chosen: s.options[0].text }));

function TimerScreen({ steps, presenceCount, onDone }) {
  const safeSteps = (steps && steps.length > 0) ? steps : FALLBACK_STEPS;
  const [stepIdx, setStepIdx] = useState(0);
  const step = safeSteps[stepIdx];
  const totalSecs = [5 * 60, 10 * 60, 20 * 60][stepIdx];
  const [secs, setSecs] = useState(totalSecs);
  const [running, setRunning] = useState(false);
  const [presence] = useState(presenceCount + Math.floor(Math.random() * 12));
  const [presenceDelta, setPresenceDelta] = useState(0);
  const intervalRef = useRef();

  useEffect(() => {
    if (running) {
      intervalRef.current = setInterval(() => setSecs(s => Math.max(0, s - 1)), 1000);
    } else clearInterval(intervalRef.current);
    return () => clearInterval(intervalRef.current);
  }, [running]);

  useEffect(() => {
    const t = setInterval(() => setPresenceDelta(d => d + (Math.random() > 0.5 ? 1 : -1)), 8000);
    return () => clearInterval(t);
  }, []);

  const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const progress = 1 - secs / totalSecs;
  const r = 80, circ = 2 * Math.PI * r;

  return (
    <Screen>
      <div style={{ display: 'flex', flexDirection: 'column', height: '100%', padding: '52px 28px 36px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 24 }}>
          {safeSteps.map((s, i) => (
            <div key={i} style={{
              flex: 1, height: 3, borderRadius: 99,
              background: i < stepIdx ? 'var(--accent)' : 'var(--surface2)',
              position: 'relative', overflow: 'hidden',
            }}>
              {i === stepIdx && (
                <div style={{
                  position: 'absolute', inset: 0, background: 'var(--accent)',
                  transformOrigin: 'left', transform: `scaleX(${progress})`, transition: 'transform 1s linear',
                }} />
              )}
            </div>
          ))}
        </div>

        <Tag>{step.label}</Tag>
        <h2 style={{ fontSize: 20, fontWeight: 700, marginBottom: 6, marginTop: 10 }}>{step.title}</h2>
        <p style={{ fontSize: 13, color: 'var(--text-muted)', lineHeight: 1.6, marginBottom: 28 }}>{step.chosen}</p>

        <div style={{
          background: 'var(--surface)', borderRadius: 14, padding: '12px 16px',
          display: 'flex', alignItems: 'center', gap: 10, marginBottom: 28,
          border: '1px solid var(--border)',
        }}>
          <div style={{ display: 'flex', flexShrink: 0 }}>
            {[...Array(5)].map((_, i) => (
              <div key={i} style={{
                width: 20, height: 20, borderRadius: '50%',
                background: `oklch(0.72 0.16 ${55 + i * 18})`,
                border: '2px solid var(--surface)',
                marginLeft: i > 0 ? -6 : 0,
                animation: `presence 2s ${i * 0.3}s infinite`,
              }} />
            ))}
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <span style={{ fontSize: 14, fontWeight: 600, color: 'var(--accent)' }}>
              {presence + presenceDelta} people
            </span>
            <span style={{ fontSize: 13, color: 'var(--text-muted)' }}> working right now</span>
          </div>
          <div style={{ width: 8, height: 8, borderRadius: '50%', background: '#4ade80', animation: 'pulse 2s infinite', flexShrink: 0 }} />
        </div>

        <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{ position: 'relative', width: 200, height: 200 }}>
            <svg width="200" height="200" style={{ transform: 'rotate(-90deg)' }}>
              <circle cx="100" cy="100" r={r} fill="none" stroke="var(--surface2)" strokeWidth="6" />
              <circle cx="100" cy="100" r={r} fill="none" stroke="var(--accent)" strokeWidth="6"
                strokeDasharray={circ} strokeDashoffset={circ * (1 - progress)}
                strokeLinecap="round" style={{ transition: 'stroke-dashoffset 1s linear' }} />
            </svg>
            <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
              <div style={{ fontSize: 38, fontWeight: 700, fontVariantNumeric: 'tabular-nums', letterSpacing: '-1px' }}>
                {fmt(secs)}
              </div>
              <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 4 }}>
                {running ? 'Focusing' : 'Ready'}
              </div>
            </div>
          </div>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          <Btn onClick={() => setRunning(r => !r)} style={{ width: '100%' }}>
            {running ? '⏸ Pause' : (secs === totalSecs ? '▶ Start Timer' : '▶ Resume')}
          </Btn>
          {stepIdx < safeSteps.length - 1 ? (
            <Btn variant="ghost" onClick={() => { setStepIdx(i => i + 1); setSecs([5*60, 10*60, 20*60][stepIdx+1]); setRunning(false); }} style={{ width: '100%' }}>
              Next Step
            </Btn>
          ) : (
            <Btn variant="ghost" onClick={onDone} style={{ width: '100%' }}>
              All done!
            </Btn>
          )}
        </div>
      </div>
    </Screen>
  );
}

// ── Screen 5: Completion / Verify ─────────────────────────
function CompletionScreen({ task, onArchive }) {
  const [cameraOpen, setCameraOpen] = useState(false);
  const [cameraError, setCameraError] = useState(null);
  const [flashing, setFlashing] = useState(false);
  const [text, setText] = useState('');
  const [done, setDone] = useState(false);
  const fileRef = useRef();
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const [photoPreview, setPhotoPreview] = useState(null);

  // Open camera: try real getUserMedia, fall back to file picker on failure
  const openCamera = async () => {
    setCameraError(null);
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      // No camera API available — fall back to file picker (which uses capture on mobile)
      fileRef.current?.click();
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 1280 } },
        audio: false,
      });
      streamRef.current = stream;
      setCameraOpen(true);
    } catch (err) {
      // Permission denied, no camera, etc. — fall back to file picker
      console.warn('Camera unavailable:', err);
      setCameraError(err.name || 'CameraError');
      fileRef.current?.click();
    }
  };

  // Wire the stream to the video element once it mounts
  useEffect(() => {
    if (cameraOpen && videoRef.current && streamRef.current) {
      videoRef.current.srcObject = streamRef.current;
      videoRef.current.play().catch(() => {});
    }
  }, [cameraOpen]);

  // Stop the stream when leaving camera view or unmounting
  const stopStream = () => {
    if (streamRef.current) {
      streamRef.current.getTracks().forEach(t => t.stop());
      streamRef.current = null;
    }
  };
  useEffect(() => () => stopStream(), []);

  const closeCamera = () => {
    stopStream();
    setCameraOpen(false);
  };

  const takePhoto = () => {
    const video = videoRef.current;
    if (!video || !video.videoWidth) return;

    // brief flash
    setFlashing(true);
    setTimeout(() => setFlashing(false), 150);

    // Draw current video frame to canvas, export as JPEG
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.9);

    setPhotoPreview(dataUrl);
    stopStream();
    setTimeout(() => setCameraOpen(false), 180);
  };

  if (cameraOpen) return (
    <Screen>
      <div style={{ position: 'relative', width: '100%', height: '100%', background: '#000', display: 'flex', flexDirection: 'column' }}>
        <div style={{ flex: 1, position: 'relative', overflow: 'hidden', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          {/* live video */}
          <video
            ref={videoRef}
            autoPlay
            playsInline
            muted
            style={{ width: '100%', height: '100%', objectFit: 'cover', background: '#000' }}
          />

          {/* rule of thirds grid */}
          <div style={{ position: 'absolute', inset: 0, opacity: 0.15, pointerEvents: 'none' }}>
            <div style={{ position: 'absolute', left: '33%', top: 0, bottom: 0, borderLeft: '1px solid white' }}/>
            <div style={{ position: 'absolute', left: '66%', top: 0, bottom: 0, borderLeft: '1px solid white' }}/>
            <div style={{ position: 'absolute', top: '33%', left: 0, right: 0, borderTop: '1px solid white' }}/>
            <div style={{ position: 'absolute', top: '66%', left: 0, right: 0, borderTop: '1px solid white' }}/>
          </div>

          {/* flash overlay on capture */}
          {flashing && (
            <div style={{ position: 'absolute', inset: 0, background: 'white', animation: 'fadeIn 0.08s ease', pointerEvents: 'none' }}/>
          )}

          {/* top bar */}
          <div style={{ position: 'absolute', top: 56, left: 0, right: 0, display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0 24px' }}>
            <button onClick={closeCamera} style={{ background: 'rgba(0,0,0,0.5)', border: 'none', color: 'white', borderRadius: '50%', width: 50, height: 50, cursor: 'pointer', fontSize: 22, fontFamily: 'var(--font)' }}>×</button>
            <div style={{ background: 'rgba(0,0,0,0.5)', borderRadius: 99, padding: '8px 14px', fontSize: 13, color: 'rgba(255,255,255,0.85)' }}>Proof shot</div>
            <div style={{ width: 50 }}/>
          </div>
        </div>

        {/* shutter */}
        <div style={{ padding: '28px 0 48px', background: '#000', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <button onClick={takePhoto} style={{
            width: 72, height: 72, borderRadius: '50%',
            background: 'white', border: '4px solid rgba(255,255,255,0.3)',
            cursor: 'pointer', transition: 'transform 0.1s',
            boxShadow: '0 0 0 3px rgba(255,255,255,0.15)',
          }}
            onMouseDown={e => e.currentTarget.style.transform = 'scale(0.92)'}
            onMouseUp={e => e.currentTarget.style.transform = ''}
          />
        </div>
      </div>
    </Screen>
  );

  const handlePhoto = e => {
    const f = e.target.files[0];
    if (f) {
      // Convert file to dataURL so it persists even if input is reset
      const reader = new FileReader();
      reader.onload = () => setPhotoPreview(reader.result);
      reader.readAsDataURL(f);
    }
    // reset input value so picking same file twice still triggers onChange
    e.target.value = '';
  };

  const handleVerify = () => {
    setDone(true);
    setTimeout(() => onArchive({ task, text: text || "First action complete!", photo: photoPreview }), 1800);
  };

  if (done) return (
    <Screen>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 40, gap: 20 }}>
        <div style={{ animation: 'fadeUp 0.4s ease', width: 64, height: 64, borderRadius: '50%', background: 'var(--accent)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path d="M5 12.5l5 5L20 7" stroke="#16130f" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </div>
        <h2 style={{ fontSize: 24, fontWeight: 700, textAlign: 'center', color: 'var(--text)', animation: 'fadeUp 0.4s 0.1s ease both' }}>
          Today's first action<br />is logged!
        </h2>
        <p style={{ fontSize: 14, color: 'var(--text-muted)', textAlign: 'center', animation: 'fadeUp 0.4s 0.2s ease both' }}>
          Adding to your archive...
        </p>
      </div>
    </Screen>
  );

  return (
    <Screen>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', padding: '64px 28px 36px' }}>
        <div style={{ animation: 'fadeUp 0.4s ease' }}>
          <h2 style={{ fontSize: 26, fontWeight: 700, marginBottom: 8 }}>
            You did it!
          </h2>
          <p style={{ fontSize: 14, color: 'var(--text-muted)', lineHeight: 1.6, marginBottom: 32, wordBreak: 'break-word' }}>
            "{task}"<br/>Want to log today's first action?
          </p>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 14, animation: 'fadeUp 0.4s 0.1s ease both' }}>
          <div>
            <p style={{ fontSize: 12, color: 'var(--text-muted)', marginBottom: 8 }}>Attach a photo <span style={{ color: 'var(--accent)', fontWeight: 600 }}>*</span></p>
            <input ref={fileRef} type="file" accept="image/*" capture="environment" style={{ display: 'none' }} onChange={handlePhoto} />
            {!photoPreview ? (
              <button onClick={openCamera} style={{
                background: 'var(--surface)', border: '1.5px dashed var(--border)',
                borderRadius: 12, padding: '14px 16px', cursor: 'pointer', width: '100%',
                minHeight: 60, display: 'flex', alignItems: 'center', gap: 10, fontFamily: 'var(--font)',
              }}>
                <div style={{ width: 32, height: 32, borderRadius: 8, background: 'var(--surface2)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-muted)', flexShrink: 0 }}>
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="4" width="14" height="10" rx="2" stroke="currentColor" strokeWidth="1.5"/><circle cx="8" cy="9" r="2.5" stroke="currentColor" strokeWidth="1.5"/><path d="M5 4l1-2h4l1 2" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
                </div>
                <span style={{ fontSize: 13, color: 'var(--text-muted)' }}>Tap to add a photo</span>
              </button>
            ) : (
              <div style={{ position: 'relative' }}>
                <img src={photoPreview} style={{ width: '100%', borderRadius: 12, maxHeight: 150, objectFit: 'cover', display: 'block' }} alt="preview" />
                <button onClick={() => setPhotoPreview(null)} style={{
                  position: 'absolute', top: 8, right: 8, background: 'rgba(0,0,0,0.6)',
                  border: 'none', color: 'white', borderRadius: '50%', width: 32, height: 32, cursor: 'pointer', fontSize: 15, fontFamily: 'var(--font)',
                }}>×</button>
              </div>
            )}
          </div>
          <div>
            <p style={{ fontSize: 12, color: 'var(--text-muted)', marginBottom: 8 }}>How did it go? <span style={{ opacity: 0.5 }}>(optional)</span></p>
            <textarea
              value={text}
              onChange={e => setText(e.target.value)}
              placeholder="e.g. Opened my laptop and outlined the first section. Easier than I expected."
              style={{
                background: 'var(--surface)', border: '1.5px solid var(--border)',
                borderRadius: 12, padding: '14px', color: 'var(--text)',
                fontSize: 14, fontFamily: 'var(--font)', lineHeight: 1.6,
                outline: 'none', resize: 'none', minHeight: 88, width: '100%',
                transition: 'border-color 0.2s',
              }}
              onFocus={e => { e.target.style.borderColor = 'var(--accent)'; }}
              onBlur={e => e.target.style.borderColor = 'var(--border)'}
            />
          </div>
        </div>

        <div style={{ flex: 1 }} />

        <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          <Btn onClick={handleVerify} disabled={!photoPreview} style={{ width: '100%' }}>
            Complete →
          </Btn>
          <button onClick={handleVerify} style={{
            background: 'transparent', border: 'none', color: 'var(--text-muted)',
            fontSize: 15, cursor: 'pointer', padding: 12, minHeight: 50, fontFamily: 'var(--font)',
          }}>Just mark it complete</button>
        </div>
      </div>
    </Screen>
  );
}

// ── Screen 6: Archive ──────────────────────────────────────
const SAMPLE_ARCHIVE = [
  { id: 1, task: 'Memorize 20 vocab words', text: 'Done faster than I thought.', date: '2026-04-27' },
  { id: 2, task: 'Read 10 pages', text: '10 pages turned into 30.', date: '2026-04-28' },
  { id: 3, task: 'Exercise for 5 min', text: '5 minutes became 20.', date: '2026-04-29' },
  { id: 4, task: 'Write 200 words', text: 'Got into a flow state.', date: '2026-04-20' },
  { id: 5, task: 'Meditate 5 min', text: 'Harder than expected.', date: '2026-04-21' },
  { id: 6, task: 'Cold shower', text: null, date: '2026-04-22' },
  { id: 7, task: 'Journaling', text: 'Felt good.', date: '2026-04-23' },
  { id: 8, task: 'Walk 1km', text: 'Crisp morning.', date: '2026-04-24' },
  { id: 9, task: 'Drink 2L water', text: null, date: '2026-04-25' },
  { id: 10, task: 'Stretch 10 min', text: 'Tight shoulders eased up.', date: '2026-04-26' },
  { id: 11, task: 'Sketch one page', text: 'Loose lines today.', date: '2026-04-13' },
  { id: 12, task: 'No phone for 1hr', text: 'Surprisingly calm.', date: '2026-04-15' },
  { id: 13, task: 'Cook dinner', text: 'Pasta turned out great.', date: '2026-04-17' },
  { id: 14, task: 'Read essay', text: null, date: '2026-04-19' },
];

const CIRCLE_COLORS = ['#d4813a', '#16a34a', '#6b6b6b', '#f0ebe4', '#c95d3a', '#3a8fd4'];
const CIRCLE_SIZES = [44, 56, 36, 64, 48, 40, 52];

const BOARD_WIDTH = 320;
const BOARD_HEIGHT = 460;

function packCircles(items) {
  const placed = [];
  items.forEach((item) => {
    const r = CIRCLE_SIZES[item.id % CIRCLE_SIZES.length] / 2;
    const color = CIRCLE_COLORS[item.id % CIRCLE_COLORS.length];

    let bestX = -1, bestY = -1;
    const samples = 80;
    for (let i = 0; i <= samples; i++) {
      const x = r + (BOARD_WIDTH - 2 * r) * (i / samples);
      let y = BOARD_HEIGHT - r;
      for (const p of placed) {
        const dx = x - p.x;
        const sumR = r + p.r;
        if (Math.abs(dx) >= sumR) continue;
        const dy = Math.sqrt(sumR * sumR - dx * dx);
        const candidateY = p.y - dy;
        if (candidateY < y) y = candidateY;
      }
      let valid = true;
      for (const p of placed) {
        const dx = x - p.x;
        const dy = y - p.y;
        const distSq = dx * dx + dy * dy;
        const minDist = r + p.r - 0.5;
        if (distSq < minDist * minDist) { valid = false; break; }
      }
      if (!valid) continue;
      if (y > bestY) { bestY = y; bestX = x; }
    }
    if (bestX >= 0) placed.push({ x: bestX, y: bestY, r, item, color });
  });
  return placed;
}

function getWeekStart(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function formatWeekRange(weekStart) {
  const end = new Date(weekStart);
  end.setDate(end.getDate() + 6);
  const fmt = (d) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  return `${fmt(weekStart)} – ${fmt(end)}`;
}

function formatItemDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function ArchiveScreen({ newEntry, onNew }) {
  const [items, setItems] = useState(SAMPLE_ARCHIVE);
  const [selectedItem, setSelectedItem] = useState(null);
  const [weekOffset, setWeekOffset] = useState(0);

  useEffect(() => {
    if (newEntry) {
      setTimeout(() => {
        const today = new Date();
        const iso = today.toISOString().slice(0, 10);
        setItems(prev => [{
          id: Date.now() % 1000, task: newEntry.task, text: newEntry.text,
          date: iso, photo: newEntry.photo,
        }, ...prev]);
        setWeekOffset(0);
      }, 100);
    }
  }, [newEntry]);

  const thisWeekStart = getWeekStart(new Date());
  const viewWeekStart = new Date(thisWeekStart);
  viewWeekStart.setDate(viewWeekStart.getDate() - weekOffset * 7);
  const viewWeekEnd = new Date(viewWeekStart);
  viewWeekEnd.setDate(viewWeekEnd.getDate() + 7);

  const weekItems = items.filter(it => {
    const d = new Date(it.date);
    return d >= viewWeekStart && d < viewWeekEnd;
  });

  const oldestItem = items.reduce((min, it) => {
    const d = new Date(it.date);
    return !min || d < min ? d : min;
  }, null);
  const maxOffset = oldestItem ? Math.floor((thisWeekStart - getWeekStart(oldestItem)) / (7 * 86400000)) : 0;

  const placed = packCircles(weekItems);

  return (
    <Screen>
      <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
        <div style={{ padding: '52px 24px 12px', display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between' }}>
          <div>
            <h2 style={{ fontSize: 22, fontWeight: 700, marginBottom: 2 }}>Your stack</h2>
            <p style={{ fontSize: 13, color: 'var(--text-muted)' }}>Tap a circle to see details</p>
          </div>
          <div style={{ textAlign: 'right' }}>
            <div style={{ fontSize: 28, fontWeight: 700, color: 'var(--accent)', lineHeight: 1 }}>{placed.length}</div>
            <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 4 }}>completed</div>
          </div>
        </div>

        <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '0 24px 12px' }}>
          <button onClick={() => setWeekOffset(w => Math.min(maxOffset, w + 1))} disabled={weekOffset >= maxOffset} style={{
            background: 'var(--surface2)', border: '1px solid var(--border)', borderRadius: 10,
            minHeight: 50, minWidth: 50, padding: 0, cursor: weekOffset >= maxOffset ? 'default' : 'pointer',
            color: weekOffset >= maxOffset ? 'var(--border)' : 'var(--text-muted)',
            fontSize: 17, fontFamily: 'var(--font)'
          }}>←</button>
          <div style={{ flex: 1, textAlign: 'center' }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--text-soft)' }}>
              {weekOffset === 0 ? 'This week' : weekOffset === 1 ? 'Last week' : `${weekOffset} weeks ago`}
            </div>
            <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 2 }}>
              {formatWeekRange(viewWeekStart)}
            </div>
          </div>
          <button onClick={() => setWeekOffset(w => Math.max(0, w - 1))} disabled={weekOffset === 0} style={{
            background: 'var(--surface2)', border: '1px solid var(--border)', borderRadius: 10,
            minHeight: 50, minWidth: 50, padding: 0, cursor: weekOffset === 0 ? 'default' : 'pointer',
            color: weekOffset === 0 ? 'var(--border)' : 'var(--text-muted)',
            fontSize: 17, fontFamily: 'var(--font)'
          }}>→</button>
        </div>

        <div style={{ flex: 1, display: 'flex', alignItems: 'flex-end', justifyContent: 'center', padding: '0 0 6px' }}>
          <div style={{
            position: 'relative',
            width: BOARD_WIDTH,
            height: BOARD_HEIGHT,
          }}>
            {placed.map((p, idx) => (
              <div
                key={`${weekOffset}-${p.item.id}`}
                onClick={() => setSelectedItem(p.item)}
                style={{
                  position: 'absolute',
                  left: p.x - p.r,
                  top: p.y - p.r,
                  width: p.r * 2,
                  height: p.r * 2,
                  borderRadius: '50%',
                  background: p.color,
                  cursor: 'pointer',
                  transition: 'transform 0.15s ease',
                  animation: `drop 0.5s ${idx * 0.05}s ease both`,
                }}
                onMouseEnter={e => { e.currentTarget.style.transform = 'scale(1.06)'; }}
                onMouseLeave={e => { e.currentTarget.style.transform = 'scale(1)'; }}
              />
            ))}
          </div>
        </div>

        <div style={{ padding: '12px 20px 32px' }}>
          <Btn onClick={onNew} style={{ width: '100%' }}>
            + Do another one today
          </Btn>
        </div>
      </div>

      {selectedItem && (
        <div onClick={() => setSelectedItem(null)} style={{
          position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.7)',
          display: 'flex', alignItems: 'flex-end', borderRadius: 40,
          animation: 'fadeIn 0.2s ease', zIndex: 100,
        }}>
          <div onClick={e => e.stopPropagation()} style={{
            width: '100%', background: 'var(--surface)', borderRadius: '24px 24px 0 0',
            padding: '24px 24px 40px', animation: 'fadeUp 0.25s ease',
            borderTop: `4px solid ${CIRCLE_COLORS[selectedItem.id % CIRCLE_COLORS.length]}`,
          }}>
            <div style={{ width: 36, height: 4, borderRadius: 99, background: 'var(--border)', margin: '0 auto 20px' }}/>
            <div style={{ fontSize: 12, color: 'var(--text-muted)', marginBottom: 8 }}>{formatItemDate(selectedItem.date)}</div>
            <h3 style={{ fontSize: 20, fontWeight: 700, marginBottom: 12, wordBreak: 'break-word' }}>{selectedItem.task}</h3>
            {selectedItem.photo && (
              <img src={selectedItem.photo} alt="" style={{ width: '100%', borderRadius: 10, maxHeight: 180, objectFit: 'cover', marginBottom: 12, display: 'block' }} />
            )}
            {selectedItem.text && (
              <p style={{ fontSize: 14, color: 'var(--text-muted)', lineHeight: 1.6, borderTop: '1px solid var(--border)', paddingTop: 12 }}>
                "{selectedItem.text}"
              </p>
            )}
            <button onClick={() => setSelectedItem(null)} style={{
              marginTop: 20, width: '100%', background: 'var(--surface2)', border: '1px solid var(--border)',
              borderRadius: 12, minHeight: 50, padding: 0, color: 'var(--text-muted)', cursor: 'pointer',
              fontSize: 15, fontFamily: 'var(--font)',
            }}>Close</button>
          </div>
        </div>
      )}
    </Screen>
  );
}

// ── App ────────────────────────────────────────────────────
function App() {
  const { TweaksPanel, useTweaks } = window;
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = useState('input');
  const [task, setTask] = useState('');
  const [steps, setSteps] = useState([]);
  const [archiveEntry, setArchiveEntry] = useState(null);

  useEffect(() => {
    document.documentElement.style.setProperty('--accent', tweaks.accentColor);
  }, [tweaks.accentColor]);

  const go = s => setScreen(s);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '100vh', padding: 20, background: 'var(--bg)' }}>
      {screen === 'input' && <InputScreen onNext={t => { setTask(t); go('loading'); }} />}
      {screen === 'loading' && <LoadingScreen task={task} onNext={() => go('steps')} />}
      {screen === 'steps' && <StepsScreen task={task} onNext={s => { setSteps(s); go('timer'); }} />}
      {screen === 'timer' && <TimerScreen steps={steps} presenceCount={tweaks.presenceCount} onDone={() => go('completion')} />}
      {screen === 'completion' && <CompletionScreen task={task} onArchive={entry => { setArchiveEntry(entry); go('archive'); }} />}
      {screen === 'archive' && <ArchiveScreen newEntry={archiveEntry} onNew={() => { setTask(''); setSteps([]); setArchiveEntry(null); go('input'); }} />}

      <TweaksPanel tweaks={tweaks} setTweak={setTweak}>
        <div style={{ marginBottom: 16 }}>
          <label style={{ fontSize: 12, color: 'rgba(255,255,255,0.5)', display: 'block', marginBottom: 6 }}>Jump to screen</label>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
            {['input','loading','steps','timer','completion','archive'].map(s => (
              <button key={s} onClick={() => go(s)} style={{
                background: screen === s ? 'var(--accent)' : 'rgba(255,255,255,0.08)',
                border: 'none', borderRadius: 6, padding: '5px 10px',
                color: screen === s ? '#16130f' : 'rgba(255,255,255,0.6)',
                fontSize: 11, cursor: 'pointer', fontFamily: 'var(--font)',
              }}>{s}</button>
            ))}
          </div>
        </div>
        <window.TweakColor id="accentColor" label="Accent color" tweaks={tweaks} setTweak={setTweak} />
        <window.TweakNumber id="presenceCount" label="People working now" tweaks={tweaks} setTweak={setTweak} min={10} max={9999} />
        <window.TweakNumber id="timerMinutes" label="Default timer (min)" tweaks={tweaks} setTweak={setTweak} min={1} max={60} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
